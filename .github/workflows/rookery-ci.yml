# Rookery (chess.missing.website): checks every change; on main it applies database migrations
# to Supabase and deploys the Worker to Cloudflare. Each of those steps runs only once its
# repository secrets exist, and skips itself otherwise.
name: rookery

on:
  push:
    paths:
      - 'rookery/**'
      - 'tools/offline/**'
      - '.github/workflows/rookery-ci.yml'
  pull_request:
    paths:
      - 'rookery/**'
      - 'tools/offline/**'
      - '.github/workflows/rookery-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rookery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rookery
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rookery/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit, Worker and database tests
        run: npm test
      - name: Build static site
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  # The rest of missing.website must keep working: its tests pass and Rookery stays out of the
  # offline downloads.
  site-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/music/*.test.mjs
      - name: Offline file list unchanged and free of rookery/
        run: |
          node tools/offline/build-manifest.mjs
          git diff --exit-code offline-files.json
          ! grep -q '"/rookery/' offline-files.json

  # Applies new SQL migrations to the Supabase project. Runs only on main, and only once these
  # repository secrets exist: SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, SUPABASE_PROJECT_REF.
  migrate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, site-regression]
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    defaults:
      run:
        working-directory: rookery/packages/db
    steps:
      - uses: actions/checkout@v4
      - name: Skip if secrets are not configured
        id: gate
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::notice::Supabase secrets not set; skipping migrations."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.gate.outputs.run == 'true'
        with:
          version: 3.4.0
      - name: Push migrations
        if: steps.gate.outputs.run == 'true'
        run: |
          # Pinned CLI (3.x): `link` takes no password; `db push` targets the linked project via --remote,
          # and --yes confirms non-interactively (CI has no terminal to answer the prompt).
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push --remote --include-all --yes --password "$SUPABASE_DB_PASSWORD"

  # Builds the static site and deploys the Worker (site + realtime) with Wrangler. Runs only on
  # main, after the checks pass, and only once these repository secrets exist:
  # CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers" template) and CLOUDFLARE_ACCOUNT_ID.
  # If this is used, turn off Git builds for the rookery Worker in Cloudflare so they don't both deploy.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, site-regression]
    runs-on: ubuntu-latest
    concurrency:
      group: rookery-deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: rookery
    steps:
      - uses: actions/checkout@v4
      - name: Skip if secrets are not configured
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets not set; skipping deploy."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rookery/package-lock.json
      - if: steps.gate.outputs.run == 'true'
        run: npm ci --no-audit --no-fund
      - name: Build static site
        if: steps.gate.outputs.run == 'true'
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Deploy to Cloudflare
        if: steps.gate.outputs.run == 'true'
        run: npx wrangler deploy
