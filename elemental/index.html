<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f3ff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#14121f" media="(prefers-color-scheme: dark)" />
  <meta name="description" content="Elemental: start with air, water, earth and fire and combine them into hundreds of discoveries, from steam to superheroes." />
  <title>Elemental</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%236c5ce7'/%3E%3Ccircle cx='9' cy='9' r='4' fill='%23ffd166'/%3E%3Ccircle cx='15' cy='15' r='4' fill='%2306d6a0'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="logo" href="./" aria-label="Elemental">
      <span class="logo-orbs" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Elemental
    </a>
    <div class="progress" title="Discoveries">
      <span class="progress-count"><b id="count">4</b> / <span id="total">0</span></span>
      <span class="progress-bar" aria-hidden="true"><i id="bar"></i></span>
    </div>
    <nav class="actions" aria-label="Game menu">
      <button type="button" class="btn btn-hint" id="btn-hint" aria-haspopup="dialog"><span aria-hidden="true">💡</span><span class="lbl">Hint</span></button>
      <button type="button" class="btn" id="btn-book" aria-haspopup="dialog"><span aria-hidden="true">📖</span><span class="lbl">Encyclopedia</span></button>
      <button type="button" class="btn" id="btn-stats" aria-haspopup="dialog"><span aria-hidden="true">📊</span><span class="lbl">Stats</span></button>
      <button type="button" class="btn" id="btn-menu" aria-haspopup="dialog" aria-label="Save, settings and help"><span aria-hidden="true">⚙️</span><span class="lbl">Menu</span></button>
    </nav>
  </header>

  <main class="layout">
    <section class="board" id="board" aria-label="Workspace">
      <div class="board-empty" id="board-empty">
        <p class="big">Drag elements here, then drop one onto another.</p>
        <p>Click or tap an element in the list to place it. Click two elements on the board to combine them. Drag an element back to the list to remove it.</p>
      </div>
      <div class="board-tools">
        <button type="button" class="btn small" id="btn-undo" title="Undo (Ctrl+Z)"><span aria-hidden="true">↶</span> Undo</button>
        <button type="button" class="btn small" id="btn-clear" title="Clear the workspace"><span aria-hidden="true">🧹</span> Clear</button>
      </div>
    </section>

    <aside class="inventory" id="inventory" aria-label="Your elements">
      <div class="inv-head">
        <label class="search"><span class="sr-only">Search elements</span>
          <input id="search" type="search" placeholder="Search your elements…" autocomplete="off" spellcheck="false" />
        </label>
        <label class="sort"><span class="sr-only">Sort</span><select id="sort"></select></label>
      </div>
      <div class="chips" id="chips" role="group" aria-label="Filter by category"></div>
      <p class="inv-info" id="inv-info" aria-live="polite"></p>
      <div class="inv-grid" id="inv-grid"></div>
    </aside>
  </main>

  <div class="hint-pop" id="hint-pop" role="dialog" aria-label="Hint" hidden></div>
  <div class="discovery" id="discovery" hidden></div>
  <dialog class="modal" id="modal"><div class="modal-inner" id="modal-inner"></div></dialog>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <noscript><p class="noscript">Elemental needs JavaScript.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
