<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090909"><title>maps — missing.website</title><link rel="icon" href="/favicon.png?v=3"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=VT323&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css?v=5"></head><body><div class="noise" aria-hidden="true"></div><header class="topbar simple-topbar"><a class="wordmark" href="/">stalkr</a><nav><a href="/">home</a><a href="/maps.html" aria-current="page">maps</a><a href="/blog.html">blog</a></nav><a class="top-link" href="/">← back</a></header><main class="standalone-shell"><section class="panel maps-panel standalone-maps"><div class="section-heading maps-heading"><div><p class="eyebrow">workshop</p><h1>maps i've made</h1></div><p class="hint">projects, experiments, and releases</p></div><div class="map-tabs" role="tablist"><button class="map-tab active" type="button" aria-selected="true" data-map-tab="gmod">garry's mod</button><button class="map-tab" type="button" aria-selected="false" data-map-tab="bonelab">bonelab</button></div><div class="map-tab-panel active" data-map-panel="gmod"><div class="map-grid"><article class="map-card map-placeholder"><div class="map-thumb"><span>GMod</span></div><div class="map-info"><p class="map-type">garry's mod</p><h3>map coming soon</h3><p>screenshots, descriptions, and workshop links can go here.</p></div></article></div></div><div class="map-tab-panel" data-map-panel="bonelab" hidden><div class="map-grid"><a class="map-card" href="https://mod.io/g/bonelab/m/gm-manhattanmegamallnightv1#description" target="_blank" rel="noreferrer"><div class="map-thumb"><img src="https://images.steamusercontent.com/ugc/7414005913059112/673AB8163D57F042567DE4BD18E
