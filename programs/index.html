<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#090909" />
  <title>programs — missing.website</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png?v=4" />
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=VT323&family=Nosifer&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css?v=13" />
  <style>
    .programs-shell{width:min(1260px,calc(100% - 34px));margin:38px auto 70px}
    .programs-head{margin-bottom:26px}
    .programs-head h1{margin:0;font-weight:400;font-size:1.7rem}
    .programs-list{display:flex;flex-direction:column;gap:26px}
    /* preview is 1260 x 320 */
    .program{position:relative;display:block;width:100%;aspect-ratio:1260/320;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:#0b0b0b;text-decoration:none;color:#fff;isolation:isolate}
    .program-img{position:absolute;inset:0;background:var(--img,linear-gradient(135deg,#2a2424,#121010)) center/cover no-repeat;transition:filter .3s ease,transform .3s ease}
    .program:hover .program-img,.program:focus-visible .program-img{filter:blur(4px);transform:scale(1.03)}
    .program-name{font-family:"Nosifer","Special Elite",cursive;font-weight:400;color:#7dff3a;letter-spacing:.02em;text-shadow:0 0 14px rgba(94,255,40,.55),0 3px 0 #1c5a0a,0 6px 12px rgba(0,0,0,.9);opacity:0;transition:opacity .3s ease;position:absolute;left:clamp(18px,4vw,48px);top:50%;transform:translateY(-50%);z-index:1;max-width:60%;font-size:clamp(1rem,3vw,2.1rem);line-height:1.25}
    .program:hover .program-name,.program:focus-visible .program-name{opacity:1}
    .programs-empty{color:var(--muted)}
    @media(max-width:520px){.programs-shell{width:calc(100% - 16px)}.program{border-radius:16px}}
  </style>
</head>
<body><div class="noise" aria-hidden="true"></div>
<header class="topbar"><a class="wordmark" href="/">stalkr</a><nav aria-label="Primary navigation"><a href="/#about">about</a><a href="/#games">games</a><a href="/maps.html">maps</a><a href="/programs/">programs</a><a href="/blog.html">blog</a><a href="/inventory.html">inventory</a><a href="/#links">links</a></nav><span></span></header>
<main class="programs-shell">
  <div class="programs-head"><p class="eyebrow">library</p><h1>programs</h1></div>
  <div class="programs-list" id="list"><p class="programs-empty">loading…</p></div>
</main>
<script>
fetch('programs.json').then(r => r.json()).then(items => {
  const list = document.getElementById('list');
  list.innerHTML = '';
  if (!items.length) { list.innerHTML = '<p class="programs-empty">nothing here yet.</p>'; return; }
  items = items.filter(p => !p.hidden);
  if (!items.length) { list.innerHTML = '<p class="programs-empty">nothing here yet.</p>'; return; }
  items.forEach(p => {
    const a = document.createElement('a');
    a.className = 'program';
    if (p.url) { a.href = p.url; } else { a.removeAttribute('href'); }
    const img = document.createElement('div');
    img.className = 'program-img';
    if (p.image) img.style.setProperty('--img', 'url("' + new URL(p.image, location.href).href.replace(/"/g, '%22') + '")');
    a.setAttribute('aria-label', p.name);
    a.append(img);
    const name = document.createElement('span');
    name.className = 'program-name';
    name.textContent = p.name;
    a.append(name);
    list.appendChild(a);
  });
}).catch(() => { document.getElementById('list').innerHTML = '<p class="programs-empty">couldn\'t load programs.</p>'; });
</script>
</body>
</html>
