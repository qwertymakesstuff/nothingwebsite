<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fortune Street has moved</title>
  <link rel="canonical" href="https://play.missing.website/fortune-street/" />
  <noscript><meta http-equiv="refresh" content="0; url=https://play.missing.website/fortune-street/" /></noscript>
  <style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0c1923;color:#f3ead8;font:16px/1.5 system-ui,sans-serif;text-align:center;padding:16px}a{color:#e8b450}</style>
</head>
<body>
  <p>Fortune Street now lives at <a href="https://play.missing.website/fortune-street/">play.missing.website/fortune-street</a>. Taking you there…</p>
  <script>
  // Fortune Street moved to the play arcade. Browsers keep saved data per site, so hand the
  // saved match, settings and tutorial progress over in the URL fragment (never sent to a server);
  // the game imports them on arrival without overwriting anything already saved there.
  (function () {
    var target = 'https://play.missing.website/fortune-street/';
    var keys = ['fortune-street:save', 'fortune-street:settings', 'fortune-street:tutorial'];
    var data = {};
    try { keys.forEach(function (k) { var v = localStorage.getItem(k); if (v != null) data[k] = v; }); } catch (e) {}
    var hash = Object.keys(data).length ? '#import=' + encodeURIComponent(JSON.stringify(data)) : '';
    location.replace(target + hash);
  })();
  </script>
</body>
</html>
