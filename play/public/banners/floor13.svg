<circle cx="100" cy="44" r="24" fill="url(#btn)"/><text x="100" y="52">11</text>
<circle cx="150" cy="44" r="24" fill="url(#btn)"/><text x="150" y="52">12</text>
<circle cx="50" cy="104" r="24" fill="url(#btn)"/><text x="50" y="112">7</text>
<circle cx="100" cy="104" r="24" fill="url(#btn)"/><text x="100" y="112">8</text>
<circle cx="150" cy="104" r="24" fill="url(#btn)"/><text x="150" y="112">9</text>
<circle cx="100" cy="176" r="30" fill="#ffd97a" stroke="#6b4304" stroke-width="3" filter="url(#glow)"/><text x="100" y="185" font-size="26">13</text>
