<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#121014" />
  <meta name="description" content="Idle Empire: strike crowns at the Mint and grow a market stall into an industrial empire." />
  <title>Idle Empire</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='11' fill='%23e8b54a'/%3E%3Cpath d='M6 16l1-7 3 3 2-4 2 4 3-3 1 7z' fill='%235a3c0c'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/animations.css" />
</head>
<body>
  <header class="topbar">
    <h1 class="wordmark"><span class="wordmark-crown" aria-hidden="true"></span>Idle Empire</h1>
    <a class="back-link" href="/">missing.website</a>
  </header>

  <main class="game">
    <section class="mint-panel" aria-label="The Mint">
      <div class="treasury">
        <p class="currency-amount"><span class="coin" aria-hidden="true"></span><span id="currency">0</span></p>
        <p class="currency-label">crowns</p>
        <div class="rates">
          <p><span>per second</span><b id="perSecond">0</b></p>
          <p><span>per click</span><b id="perClick">1</b></p>
        </div>
      </div>
      <div class="mint-stage">
        <button id="mint" class="mint" type="button" aria-label="Strike a crown at the Mint"></button>
      </div>
      <p class="mint-hint">Click the Mint to strike crowns. Spend them on buildings that strike crowns for you.</p>
    </section>

    <section class="upgrade-panel" aria-labelledby="upgradeTitle">
      <div class="panel-head">
        <h2 id="upgradeTitle">Upgrades</h2>
        <p class="panel-count" id="upgradeCount"></p>
      </div>
      <div id="upgrades" class="upgrade-list"></div>
      <details id="ownedUpgrades" class="owned-upgrades" hidden>
        <summary>Purchased <span id="ownedUpgradeCount">0</span></summary>
        <div id="ownedUpgradeList" class="owned-list"></div>
      </details>
    </section>

    <section class="shop-panel" aria-labelledby="shopTitle">
      <div class="panel-head">
        <h2 id="shopTitle">Buildings</h2>
        <div id="buyModes" class="buy-modes" role="radiogroup" aria-label="How many to buy"></div>
      </div>
      <p class="panel-note">Each one costs more than the last. Max buys as many as you can afford.</p>
      <div id="shop" class="shop-list"></div>
    </section>
  </main>

  <div id="floaters" class="floaters" aria-hidden="true"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
