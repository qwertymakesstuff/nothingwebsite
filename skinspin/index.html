<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0e14" />
  <meta name="description" content="SkinSpin: a case-opening simulator with fictional skins and fictional coins." />
  <title>SkinSpin</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%230b0e14'/%3E%3Cpath d='M20 7 A13 13 0 0 1 33 20' fill='none' stroke='%23ffb627' stroke-width='4' stroke-linecap='round'/%3E%3Cpath d='M20 33 A13 13 0 0 1 7 20' fill='none' stroke='%237c6cff' stroke-width='4' stroke-linecap='round'/%3E%3Cpath d='M20 13 L26 20 L20 27 L14 20 Z' fill='%23ffb627'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/views.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <a class="brand" href="#/home" id="brand"></a>
      <nav id="nav"></nav>
      <p class="sidebar-foot">Fictional coins and items only. Nothing here has real-world value.<br><a href="/">missing.website</a></p>
    </aside>
    <div class="scrim" id="scrim"></div>
    <div class="main-col">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open navigation" aria-expanded="false"></button>
        <h1 class="page-title" id="pageTitle">SkinSpin</h1>
        <div class="top-stats">
          <button class="refill-btn" id="refillBtn" hidden>Claim free coins</button>
          <a class="stat-pill inv-pill" href="#/inventory" id="invPill" title="Inventory"></a>
          <a class="stat-pill level-pill" href="#/profile" id="levelPill" title="Level"></a>
          <span class="stat-pill balance-pill" id="balancePill" title="Balance"></span>
        </div>
      </header>
      <div class="save-warning" id="saveWarning" hidden></div>
      <main id="view" tabindex="-1"></main>
    </div>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <noscript><p class="noscript">SkinSpin needs JavaScript to run.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
